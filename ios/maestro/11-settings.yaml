# Settings (needs KNOWLEDGE=1 seed.sh): AI text, language, vocabulary (chips, hint, suggestion 加入), 我是誰,
# person rename → merge, unsaved-changes guard, 儲存 (checked via the API), 「（我）」 in the transcript, delete a person.
appId: ai.3mi.tally
env:
  BACKEND: ${BACKEND || 'http://127.0.0.1:8795'}
---
- retry: # simctl launch can race the previous instance's exit; the first snapshot then reports the app as not running
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- tapOn: 設定
- extendedWaitUntil:
    visible: 關於我
    timeout: 10000
- tapOn:
    id: settings.about
- inputText: iOS 測試者
- runFlow: # first-keyboard-use tip on a fresh simulator
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- tapOn:
    id: keyboard.done
- tapOn:
    id: settings.close
- extendedWaitUntil:
    visible: 有未儲存的變更
    timeout: 5000
- tapOn: 繼續編輯
- tapOn: 預設轉錄語言
- tapOn: English
- tapOn: 我是誰
- tapOn: 王小明
- scrollUntilVisible:
    element:
      id: vocab.input
    direction: DOWN
- tapOn:
    id: vocab.input
- inputText: Tally,Groq,
- extendedWaitUntil:
    visible: 2 個詞都會送進語音辨識
    timeout: 5000
- tapOn: 加入「iOS」
- extendedWaitUntil:
    visible: 3 個詞都會送進語音辨識
    timeout: 10000
- assertVisible: 移除 iOS
- tapOn:
    id: keyboard.done
- scrollUntilVisible:
    element: 改名「陳大華」
    direction: UP
    visibilityPercentage: 100
    centerElement: true
- tapOn: 改名「陳大華」
- extendedWaitUntil:
    visible: 重新命名講者
    timeout: 5000
- eraseText: 20
- inputText: 王小明
- tapOn: 確定
- extendedWaitUntil:
    visible: 「王小明」已存在，要合併嗎？
    timeout: 10000
- tapOn: 合併
- extendedWaitUntil:
    notVisible: 改名「陳大華」
    timeout: 10000
- takeScreenshot: ${SHOTS || '/tmp'}/m11-settings
# a rejected word (> 50 chars) left in the input stops 儲存: the sheet stays open with the error and the word
- scrollUntilVisible:
    element:
      id: vocab.input
    direction: DOWN
- tapOn:
    id: vocab.input
- inputText: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
- tapOn:
    id: keyboard.done
- tapOn:
    id: settings.save
- scrollUntilVisible:
    element:
      id: settings.error
    direction: UP
- assertVisible: .*超過 50 字.*
- assertVisible:
    id: settings.save
- scrollUntilVisible:
    element:
      id: vocab.input
    direction: DOWN
- tapOn:
    id: vocab.input
- eraseText: 60
- tapOn:
    id: keyboard.done
- tapOn:
    id: settings.save
- extendedWaitUntil: # the sheet closes on success (toast 「已儲存設定」 is too brief to assert reliably here)
    notVisible:
      id: settings.save
    timeout: 10000
- evalScript: ${output.s = json(http.get(BACKEND + '/api/settings').body)}
- assertTrue: ${output.s.stt_lang == 'en' && output.s.about.includes('iOS 測試者') && output.s.vocab.join() == 'Tally,Groq,iOS' && output.s.me != null}
# the speaker who is 我 gets 「（我）」 in the transcript; summaries default to the transcription language
- tapOn: 知識測試
- extendedWaitUntil:
    visible: .*（我）.*
    timeout: 15000
- takeScreenshot: ${SHOTS || '/tmp'}/m11-me
- tapOn: 摘要
- assertVisible: English
- tapOn: # back to the list (the back button's label is the last view, which depends on earlier flows)
    id: BackButton
# delete a person: confirm text, it leaves the list
- tapOn: 設定
- extendedWaitUntil:
    visible: 我是誰
    timeout: 10000
- scrollUntilVisible: # other people (e.g. Bob from flow 04) may come first
    element: 刪除「王小明」
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
- tapOn: 刪除「王小明」
- extendedWaitUntil:
    visible: 刪除「王小明」？0 個聲紋會一併刪除
    timeout: 5000
- tapOn: 刪除
- extendedWaitUntil:
    notVisible: 刪除「王小明」
    timeout: 10000
- tapOn:
    id: settings.close
