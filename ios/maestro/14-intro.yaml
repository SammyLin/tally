# Fresh install → the 3-page intro (what Kiroku does / 錄音或匯入 → 逐字稿與講者 → 摘要 → 問問看 / Kiroku Cloud or your own
# server), swiped through, → 開始使用 → the welcome screen. Relaunching skips the intro (seen is kept in UserDefaults).
appId: ai.3mi.tally
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
- assertVisible: 把對話記下來
- assertVisible:
    id: intro.skip
- takeScreenshot: ${SHOTS || '/tmp'}/m14-intro-1
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible: 一段錄音怎麼變成筆記
    timeout: 5000
- assertVisible: 1. 錄音或匯入.*
- assertVisible: 4. 問問看.*
- takeScreenshot: ${SHOTS || '/tmp'}/m14-intro-2
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible: 資料放在哪裡，由你決定
    timeout: 5000
- assertVisible: Kiroku Cloud.*
- assertNotVisible:
    id: intro.next
- takeScreenshot: ${SHOTS || '/tmp'}/m14-intro-3
- tapOn:
    id: intro.start
- assertVisible:
    id: connect.cloud
- assertVisible:
    id: connect.selfhost
- retry: # simctl launch can race the previous instance's exit
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - extendedWaitUntil:
          visible:
            id: connect.cloud
          timeout: 10000
- assertNotVisible:
    id: intro.skip
