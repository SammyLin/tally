# Group C parity (needs `PARITY=1 STATE=… seed.sh clip.m4a`): runner header (none online + 「排隊 1」), the no-runner notice on
# a queued recording, tally:// links (summary tab, trash, 問問看), Markdown table in a summary with its date, 1.75× speed,
# speaker bands, transcript range → 「複製這段為 Prompt」, and removing the offline runner with its visible button.
appId: ai.3mi.tally
env:
  BACKEND: ${BACKEND || 'http://127.0.0.1:8795'}
---
- retry: # simctl launch can race the previous instance's exit; the first snapshot then reports the app as not running
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 排隊測試
    timeout: 20000
# C5 header
- extendedWaitUntil:
    visible:
      id: library.runners
      text: .*沒有 runner 在線.*排隊 [1-9].*
    timeout: 20000
- takeScreenshot: ${SHOTS || '/tmp'}/m12-header
# C6 no-runner notice
- tapOn: 排隊測試
- extendedWaitUntil:
    visible: 排隊中。目前沒有 runner 在線，會等 runner 上線後自動處理。
    timeout: 15000
- takeScreenshot: ${SHOTS || '/tmp'}/m12-queued
# C12/C14 link straight to the summary tab of 「會議測試」 (C1 table, C15 date)
- runScript:
    file: scripts/recording-field.js
    env: { Q: 會議測試, FIELD: id }
- runFlow:
    file: subflows/open-link.yaml
    env: { LINK: "tally://rec/${output.value}/summary" }
- extendedWaitUntil:
    visible: 負責人
    timeout: 15000
- assertVisible: 王小明
- assertVisible: .*寄出報價.*
- assertVisible: npm run deploy
- assertVisible:
    id: summary\.\d+\.date
- takeScreenshot: ${SHOTS || '/tmp'}/m12-markdown
# C8 player: 1.75× and speaker bands (bands are decorative; the screenshot shows them)
- tapOn: 播放速度
- tapOn: 1.75×
- takeScreenshot: ${SHOTS || '/tmp'}/m12-speed
- tapOn: 逐字稿
# C2 range: long-press line 0 → 從這句開始選取, tap line 2 → 3 lines → copy
- longPressOn:
    id: segment.0.text
- tapOn: 從這句開始選取
- tapOn:
    id: segment.2.text
- assertVisible:
    id: selection.info
    text: 已選 3 句.*
- takeScreenshot: ${SHOTS || '/tmp'}/m12-selection
- tapOn:
    id: selection.copy
- extendedWaitUntil:
    visible:
      id: toast
      text: 已複製為 Prompt.*
    timeout: 5000
- assertNotVisible:
    id: selection.info
# C12 other links: trash view, 問問看
- runFlow:
    file: subflows/open-link.yaml
    env: { LINK: "tally://trash" }
- extendedWaitUntil:
    visible: 垃圾桶是空的
    timeout: 15000
- runFlow:
    file: subflows/open-link.yaml
    env: { LINK: "tally://ask" }
- extendedWaitUntil:
    visible:
      id: ask.input
    timeout: 15000
- tapOn: 完成
- runFlow:
    file: subflows/open-link.yaml
    env: { LINK: "tally://recent" }
- extendedWaitUntil:
    visible: 排隊測試
    timeout: 15000
# C4 visible remove button on the offline runner
- tapOn:
    id: library.runners
- tapOn:
    id: runner.remove.maestro
- extendedWaitUntil:
    visible: 還沒有 runner 連線過。
    timeout: 10000
- takeScreenshot: ${SHOTS || '/tmp'}/m12-runners
