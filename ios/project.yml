name: Tally
options:
  bundleIdPrefix: ai.3mi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: BXJJV5UT4H # "Apple Development: corn2277@gmail.com"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1 # app and extension must match
    MARKETING_VERSION: "1.0"
packages:
  Clerk: # Kiroku Cloud sign-in
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.6.1
targets:
  Tally:
    type: application
    platform: iOS
    sources: [Tally, Shared]
    dependencies:
      - target: KirokuShare
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    entitlements: # App Group: the share extension hands files over through it (see Shared/Inbox.swift)
      path: Tally/Tally.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.3mi.tally]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.3mi.tally
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES # Color(.paper), Image(.kirokuMark)
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Tally/Info.plist
      properties:
        CFBundleDisplayName: Kiroku
        CFBundleDevelopmentRegion: zh-Hant
        NSMicrophoneUsageDescription: Kiroku 需要使用麥克風來錄音。
        UIBackgroundModes: [audio]
        UILaunchScreen: {UIColorName: Paper} # brand ivory / ink navy, matches the first screen
        ITSAppUsesNonExemptEncryption: false
        # tally:// links: recordings, views, folders, trash, 問問看 (see DeepLink)
        CFBundleURLTypes: [{CFBundleURLName: ai.3mi.tally, CFBundleURLSchemes: [tally]}]
        # self-hosted backends: allow plain http to *.local / LAN dev servers (wrangler dev with DEV_NO_AUTH)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  KirokuShare: # 「存到 Kiroku」 in the share sheet: saves audio / video into the App Group inbox
    type: app-extension
    platform: iOS
    sources: [KirokuShare, Shared]
    entitlements:
      path: KirokuShare/KirokuShare.entitlements
      properties:
        com.apple.security.application-groups: [group.ai.3mi.tally]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.3mi.tally.share
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor # Shared/Brand.xcassets: same colors as the app
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: KirokuShare/Info.plist
      properties:
        CFBundleDisplayName: Kiroku
        CFBundleDevelopmentRegion: zh-Hant
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # any audio or video attachment (the extension takes at most 20 and skips the rest)
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $a,
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio" OR
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" OR
              ANY $a.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audiovisual-content").@count > 0).@count > 0
  TallyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TallyTests]
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.3mi.tally.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tally.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tally"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Tally:
    build:
      targets:
        Tally: all
        TallyTests: [test]
    test:
      targets: [TallyTests]
