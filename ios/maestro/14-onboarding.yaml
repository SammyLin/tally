# Welcome screen: the two ways in (Kiroku Cloud / own server) and 「兩者差別」.
# With -e CLOUD_BACKEND=<url> (e.g. https://kiroku.3mi.ai, or any Worker in AUTH_MODE=clerk; only GET /api/config is called) it also checks that a
# signed-out Cloud choice offers 註冊 / 登入 and opens Clerk's sign-up, then cancels. Never signs up.
appId: ai.3mi.tally
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
          arguments:
            cloudURL: ${CLOUD_BACKEND || 'https://kiroku.3mi.ai'}
- tapOn:
    id: intro.skip # fresh install: the intro comes first (14-intro walks through it)
- assertVisible:
    id: connect.cloud
- assertVisible: 使用 Kiroku Cloud
- assertVisible:
    id: connect.selfhost
- assertVisible:
    id: connect.compare
- takeScreenshot: ${SHOTS || '/tmp'}/m14-welcome
- runFlow:
    when:
      true: ${CLOUD_BACKEND}
    commands:
      - tapOn:
          id: connect.cloud
      - extendedWaitUntil:
          visible:
            id: cloud.signUp
          timeout: 20000
      - assertVisible:
          id: cloud.signIn
      - takeScreenshot: ${SHOTS || '/tmp'}/m14-cloud
      - tapOn:
          id: cloud.signUp
      - extendedWaitUntil:
          visible:
            id: cloud.cancel
          timeout: 20000
      - takeScreenshot: ${SHOTS || '/tmp'}/m14-cloud-signup
      - tapOn:
          id: cloud.cancel
      - assertVisible:
          id: cloud.signUp
- tapOn:
    id: connect.selfhost
- assertVisible: 連線到自己的伺服器
- assertVisible:
    id: connect.url
- assertVisible: 還沒有伺服器？自架指南
- takeScreenshot: ${SHOTS || '/tmp'}/m14-selfhost
