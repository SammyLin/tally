# Launch (keeping state) and open the seeded, processed recording 「會議測試」.
appId: ai.3mi.tally
---
- retry: # simctl launch can race the previous instance's exit; the first snapshot then reports the app as not running
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 會議測試
    timeout: 20000
- tapOn: 會議測試
- extendedWaitUntil:
    visible:
      id: segment.2.text
    timeout: 20000
