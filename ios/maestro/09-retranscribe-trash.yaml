# 「管理測試改名」 (after flow 08): retranscribe in English → queued; trash → 垃圾桶 view → restore → trash again → purge.
appId: ai.3mi.tally
env:
  BACKEND: ${BACKEND || 'http://127.0.0.1:8795'}
---
- retry: # simctl launch can race the previous instance's exit; the first snapshot then reports the app as not running
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 管理測試改名
    timeout: 20000
- tapOn: 管理測試改名
- extendedWaitUntil:
    visible:
      id: segment.0.text
    timeout: 20000
# A11 retranscribe with a language
- tapOn:
    id: detail.more
- tapOn: 重新轉錄
- extendedWaitUntil:
    visible: 會覆蓋目前的逐字稿與講者名稱。
    timeout: 5000
- tapOn: English
- takeScreenshot: ${SHOTS || '/tmp'}/m09-language
- tapOn:
    id: lang.ok
- extendedWaitUntil:
    visible:
      id: toast
      text: 已排入重新轉錄
    timeout: 10000
- extendedWaitUntil: # processing: only the transcript tab, no 重新轉錄
    visible: "(處理中：排隊中|排隊中。).*" # 排隊中。… when no runner is online (seed-all marks it offline)
    timeout: 10000
- assertNotVisible: 摘要
- runScript:
    file: scripts/recording-field.js
    env: { Q: 管理測試改名, FIELD: language }
- assertTrue: ${output.value == 'en'}
# A7 move to trash
- tapOn:
    id: detail.more
- assertNotVisible: 重新轉錄
- tapOn: 移到垃圾桶
- extendedWaitUntil:
    visible:
      id: toast
      text: 已移到垃圾桶
    timeout: 10000
- extendedWaitUntil:
    visible: 會議測試
    timeout: 10000
- assertNotVisible: 管理測試改名
# A8 trash view
- tapOn:
    id: library.folders
- tapOn: 垃圾桶
- extendedWaitUntil:
    visible: 管理測試改名
    timeout: 10000
- assertNotVisible: 會議測試
- tapOn: 管理測試改名
- extendedWaitUntil:
    visible:
      id: detail.trashed
    timeout: 10000
- takeScreenshot: ${SHOTS || '/tmp'}/m09-trashed
# A9 restore
- tapOn:
    id: detail.more
- assertNotVisible: 複製為 Prompt
- tapOn: 還原
- extendedWaitUntil:
    visible:
      id: toast
      text: 已還原
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: detail.trashed
    timeout: 10000
- runScript:
    file: scripts/recording-field.js
    env: { Q: 管理測試改名, FIELD: deleted_at }
- assertTrue: ${output.value == 'null'}
# trash again, then A10 purge from the trash
- tapOn:
    id: detail.more
- tapOn: 移到垃圾桶
- extendedWaitUntil:
    visible: 管理測試改名
    timeout: 10000
- tapOn: 管理測試改名
- tapOn:
    id: detail.more
- tapOn: 永久刪除
- extendedWaitUntil:
    visible: 永久刪除「管理測試改名」？此動作無法復原。
    timeout: 5000
- takeScreenshot: ${SHOTS || '/tmp'}/m09-purge
- tapOn: 永久刪除 # the alert's button (the title is longer, so the full-match regex skips it)
- extendedWaitUntil:
    visible:
      id: toast
      text: 已永久刪除
    timeout: 10000
- extendedWaitUntil:
    visible: 垃圾桶是空的
    timeout: 10000
- runScript:
    file: scripts/recording-field.js
    env: { Q: 管理測試改名, FIELD: id, TRASH: '1' }
- assertTrue: ${output.value == 'none'}
- tapOn:
    id: library.folders
- tapOn: 全部
