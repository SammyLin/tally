# Detail of 「管理測試」 (seed: TITLE=管理測試 SUMMARY=1 seed.sh clip.m4a; folder 「客戶B」 from flow 07):
# rename the title in place, move it to a folder, edit a segment's text, delete its summary.
appId: ai.3mi.tally
---
- retry: # simctl launch can race the previous instance's exit; the first snapshot then reports the app as not running
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 管理測試
    timeout: 20000
- tapOn: 管理測試
- extendedWaitUntil:
    visible:
      id: segment.0.text
    timeout: 20000
- assertVisible:
    id: detail.folder
    text: 未分類
# A6 rename
- tapOn:
    id: detail.title
- eraseText: 20
- inputText: 管理測試改名
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: detail.title
      text: 管理測試改名
    timeout: 10000
# A5 move to folder
- tapOn:
    id: detail.more
- tapOn: 移到資料夾…
- extendedWaitUntil:
    visible: 移動「管理測試改名」到
    timeout: 5000
- tapOn:
    id: pick.客戶B
- extendedWaitUntil:
    visible:
      id: toast
      text: 已移到「客戶B」
    timeout: 10000
- assertVisible:
    id: detail.folder
    text: 客戶B
# A12 edit segment text
- longPressOn:
    id: segment.0.text
- tapOn: 編輯文字
- tapOn:
    id: segment.edit.text
- eraseText: 60
- inputText: 大家好，今天討論 iOS。
# 取消 with changed text asks first
- tapOn:
    id: segment.edit.cancel
- extendedWaitUntil:
    visible: 有未儲存的變更
    timeout: 5000
- tapOn: 繼續編輯
- tapOn:
    id: segment.edit.save
- extendedWaitUntil:
    visible:
      id: toast
      text: 已儲存
    timeout: 10000
- assertVisible: 大家好，今天討論 iOS。
- takeScreenshot: ${SHOTS || '/tmp'}/m08-detail
# A13 delete summary
- tapOn: 摘要
- extendedWaitUntil:
    visible: 錄音功能
    timeout: 10000
- tapOn: 刪除摘要
- extendedWaitUntil:
    visible: 刪除這份摘要？
    timeout: 5000
- tapOn: 刪除
- extendedWaitUntil:
    visible: 還沒有摘要。
    timeout: 10000
- assertNotVisible: 錄音功能
# A20 the list shows the folder name outside a folder view
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible: "(?s).*管理測試改名.*客戶B.*"
    timeout: 10000
- takeScreenshot: ${SHOTS || '/tmp'}/m08-list
