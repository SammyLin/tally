# Copy as prompt (default options) → pasteboard; the options sheet previews the same text.
# The pasteboard text itself is compared with the web's buildPrompt outside Maestro (README.md).
appId: ai.3mi.tally
---
- runFlow: subflows/open-seeded.yaml
- tapOn:
    id: detail.more
- tapOn: 複製為 Prompt
- extendedWaitUntil:
    visible:
      id: detail.toast
      text: "已複製為 Prompt.*"
    timeout: 5000
- takeScreenshot: ${SHOTS || '/tmp'}/m05-copied
- tapOn:
    id: detail.more
- tapOn: Prompt 選項與預覽…
- extendedWaitUntil:
    visible:
      id: prompt.preview
      text: "(?s)以下是一份錄音的摘要與逐字稿.*# 會議測試.*## 逐字稿.*\\[00:03\\] Bob：第一點是錄音功能.*"
    timeout: 5000
- takeScreenshot: ${SHOTS || '/tmp'}/m05-prompt-options
- tapOn: 完成
