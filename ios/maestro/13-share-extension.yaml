# 「存到 Kiroku」 share extension (needs seed-files.sh): Files → 我的 iPhone → 分享測試 → 分享 → Kiroku, set title / folder
# 客戶B (from 07) / 日本語, 儲存; then Kiroku adopts the inbox entry and uploads it (folder and language checked via the API).
appId: ai.3mi.tally
---
- retry: # Kiroku first, so the library writes folders.json for the extension's folder picker
    maxRetries: 2
    commands:
      - stopApp
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 會議測試
    timeout: 20000
- stopApp
- launchApp:
    appId: com.apple.DocumentsApp
- waitForAnimationToEnd
- tapOn: # Files reopens where it was left; from 瀏覽 go to 我的 iPhone
    text: 瀏覽
    optional: true
- tapOn:
    text: "我的.*iPhone"
    optional: true
- extendedWaitUntil:
    visible: 分享測試.*
    timeout: 10000
- longPressOn: 分享測試.*
- tapOn: 分享
- tapOn: Kiroku
- extendedWaitUntil:
    visible:
      id: share.title
    timeout: 15000
- assertVisible: 分享測試\..*
- tapOn: 資料夾 # menu pickers: tap the row label, then the option
- tapOn: .*客戶B
- assertVisible: 轉錄語言
- tapOn: 轉錄語言
- tapOn: 日本語
# the title last (see below)
- tapOn:
    id: share.title
- eraseText: 20
- inputText: 分享的錄音
- takeScreenshot: ${SHOTS || '/tmp'}/m13-share
# once the keyboard has been up, Maestro no longer sees the extension's elements (only the keyboard), so tap 儲存
# by position and check the result in the app (its 「已存到 Kiroku，開啟 App 後會上傳」 shows for ~1 s, too short to assert)
- tapOn:
    point: 88%,13%
- extendedWaitUntil: # the extension closes itself after ~1 s
    visible: "我的.*iPhone"
    timeout: 10000
- stopApp:
    appId: com.apple.DocumentsApp
- retry:
    maxRetries: 2
    commands:
      - stopApp
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 分享的錄音
    timeout: 20000
- extendedWaitUntil:
    notVisible:
      id: upload.item
    timeout: 120000
- extendedWaitUntil: # the row now comes from the server list
    visible: 分享的錄音
    timeout: 30000
- takeScreenshot: ${SHOTS || '/tmp'}/m13-uploaded
- runScript:
    file: scripts/recording-field.js
    env: { Q: 分享的錄音, FIELD: language }
- assertTrue: ${output.value == 'ja'}
- runScript:
    file: scripts/recording-field.js
    env: { Q: 分享的錄音, FIELD: folder_id }
- assertTrue: ${output.value != 'null' && output.value != 'none'}
