# Rename 說話者 2 → Bob for all segments.
appId: ai.3mi.tally
---
- runFlow: subflows/open-seeded.yaml
- tapOn:
    id: segment.1.speaker
- extendedWaitUntil:
    visible: 重新命名講者
    timeout: 5000
- tapOn:
    id: rename.name
- eraseText: 40
- inputText: Bob
- takeScreenshot: ${SHOTS || '/tmp'}/m04-rename
- tapOn:
    id: rename.save
- extendedWaitUntil:
    visible: "講者：Bob，點擊重新命名"
    timeout: 10000
- assertNotVisible: "講者：說話者 2，點擊重新命名"
- takeScreenshot: ${SHOTS || '/tmp'}/m04-renamed
