# Record ~5 s with the simulator mic, save with a title, wait for the upload queue to drain and the recording to be listed.
appId: ai.3mi.tally
---
- launchApp:
    stopApp: true
    permissions:
      microphone: allow
- tapOn:
    id: library.record
- tapOn:
    id: record.start
- extendedWaitUntil:
    visible:
      id: record.stop
    timeout: 10000
- extendedWaitUntil: # ~5 s of audio
    visible:
      id: record.timer
      text: ".*00:0[5-9]"
    timeout: 15000
- takeScreenshot: ${SHOTS || '/tmp'}/m02-recording
- tapOn:
    id: record.stop
- tapOn:
    id: save.title
- eraseText: 40
- inputText: 模擬器錄音
- takeScreenshot: ${SHOTS || '/tmp'}/m02-save
- tapOn:
    id: save.submit
- extendedWaitUntil:
    visible: 模擬器錄音
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: upload.item
    timeout: 120000
- extendedWaitUntil: # the row now comes from the server list, not the upload queue
    visible: 模擬器錄音
    timeout: 30000
- takeScreenshot: ${SHOTS || '/tmp'}/m02-uploaded
