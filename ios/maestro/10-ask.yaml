# 問問看 (needs KNOWLEDGE=1 seed.sh): list with status badges, ask a question (opens it, 排隊中…), delete it,
# retry a failed one, open an answer and follow a citation into 「知識測試」 at 00:05 (plays from there).
appId: ai.3mi.tally
---
- retry: # simctl launch can race the previous instance's exit; the first snapshot then reports the app as not running
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- tapOn:
    id: library.ask
- extendedWaitUntil:
    visible: 會議討論了什麼？
    timeout: 10000
- assertVisible: 這題會失敗嗎？
- assertVisible: 錯誤
- takeScreenshot: ${SHOTS || '/tmp'}/m10-list
# ask: an example chip fills the box; 送出 opens the new question
- tapOn: 客戶在哪幾場會議提過價格？
- tapOn:
    id: ask.send
- extendedWaitUntil:
    visible: 排隊中.*
    timeout: 10000
- assertVisible:
    id: ask.question
    text: 客戶在哪幾場會議提過價格？
- tapOn:
    id: ask.delete
- tapOn: 刪除
- extendedWaitUntil:
    visible: 會議討論了什麼？
    timeout: 10000
- assertNotVisible:
    id: ask\.3
# failed → 重試 puts it back in the queue
- tapOn: 這題會失敗嗎？.*
- extendedWaitUntil:
    visible: "回答失敗：測試失敗"
    timeout: 10000
- tapOn:
    id: ask.retry
- extendedWaitUntil:
    visible: 排隊中.*
    timeout: 10000
- swipe: # back to the list
    start: 0%, 50%
    end: 80%, 50%
- tapOn: 會議討論了什麼？.*
- extendedWaitUntil:
    visible: 參考錄音
    timeout: 10000
- assertVisible: .*第一點是錄音功能。.*
- takeScreenshot: ${SHOTS || '/tmp'}/m10-answer
- tapOn: 知識測試 00:05
- extendedWaitUntil:
    visible:
      id: player.toggle
      text: 暫停
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: player.time
      text: "00:(0[5-9]|1[0-1])"
    timeout: 10000
- takeScreenshot: ${SHOTS || '/tmp'}/m10-cited
