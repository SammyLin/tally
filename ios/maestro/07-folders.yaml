# Folders (web sidebar): create → opens it; subfolder; move to 最上層; rename; delete with its recordings-to-未分類 confirm.
# Leaves a top-level folder 「客戶B」 for flow 08.
appId: ai.3mi.tally
---
- retry: # simctl launch can race the previous instance's exit; the first snapshot then reports the app as not running
    maxRetries: 2
    commands:
      - stopApp # its own step: launchApp's built-in stop can still be terminating when simctl launches
      - launchApp:
          stopApp: false
      - waitForAnimationToEnd
- tapOn:
    id: library.folders
- tapOn:
    id: folders.add
- extendedWaitUntil:
    visible: 新資料夾名稱
    timeout: 5000
- inputText: 專案A
- tapOn:
    id: folder.name.ok
- extendedWaitUntil: # the new folder is opened (web: setView('folder', id))
    visible: 這裡沒有錄音
    timeout: 10000
- assertVisible: 專案A
- tapOn:
    id: library.folders
- tapOn: "「專案A」的動作"
- tapOn: 新增子資料夾
- extendedWaitUntil:
    visible: 在「專案A」中新增資料夾
    timeout: 5000
- inputText: 子資料夾B
- tapOn:
    id: folder.name.ok
- tapOn:
    id: library.folders
- extendedWaitUntil:
    visible: "「子資料夾B」的動作"
    timeout: 5000
- takeScreenshot: ${SHOTS || '/tmp'}/m07-tree
- tapOn: "「子資料夾B」的動作"
- tapOn: 移動到…
- extendedWaitUntil:
    visible: 移動「子資料夾B」到
    timeout: 5000
- assertNotVisible: # itself is excluded
    id: pick.子資料夾B
- tapOn:
    id: pick.最上層
- extendedWaitUntil:
    visible:
      id: toast
      text: 已移到「最上層」
    timeout: 10000
- tapOn: "「子資料夾B」的動作"
- tapOn: 重新命名
- extendedWaitUntil:
    visible: 資料夾名稱
    timeout: 5000
- eraseText: 20
- inputText: 客戶B
- tapOn:
    id: folder.name.ok
- extendedWaitUntil:
    visible: "「客戶B」的動作"
    timeout: 10000
- tapOn: "「專案A」的動作"
- tapOn: 刪除
- extendedWaitUntil:
    visible: 刪除資料夾「專案A」？
    timeout: 5000
- tapOn: 刪除
- extendedWaitUntil:
    visible:
      id: toast
      text: 已刪除資料夾
    timeout: 10000
- assertNotVisible: "「專案A」的動作"
- takeScreenshot: ${SHOTS || '/tmp'}/m07-folders
- tapOn: 全部
- extendedWaitUntil:
    visible: 會議測試
    timeout: 10000
