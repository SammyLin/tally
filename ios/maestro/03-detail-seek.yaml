# Detail: transcript + player; tapping the third segment (starts 00:07) seeks there and plays.
appId: ai.3mi.tally
---
- runFlow: subflows/open-seeded.yaml
- extendedWaitUntil:
    visible:
      id: player.slider
    timeout: 15000
- assertVisible: 說話者 1
- takeScreenshot: ${SHOTS || '/tmp'}/m03-detail
- tapOn:
    id: segment.2.text
- extendedWaitUntil:
    visible:
      id: player.time
      text: "00:(0[7-9]|1[01])"
    timeout: 10000
- takeScreenshot: ${SHOTS || '/tmp'}/m03-seeked
